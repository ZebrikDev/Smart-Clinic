[project]
name = "smart-clinic"
version = "0.1.0"
description = "Smart Clinic management system"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "python-dotenv>=1,<2",
    'tzdata; sys_platform == "win32"',
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["smart_clinic"]
